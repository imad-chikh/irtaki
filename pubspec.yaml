name: irtaki
description: مصحف ورش عن نافع

version: 0.0.1+1

environment:
  sdk: ">=3.10.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  go_router: ^13.2.0
  just_audio: ^0.9.38
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10
  # Text rendering
  arabic_justified_text: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/quran_warsh.db
    - assets/json/_meta.json
    - assets/json/warsh_complet.json
  fonts:
    - family: KFGQPCWarshOthmanTahaFont
      fonts:
        - asset: assets/fonts/uthmanic_warsh.ttf
    - family: UthmaniWarsh
      fonts:
        - asset: assets/fonts/uthmanic_warsh.ttf
    - family: me_quran
      fonts:
        - asset: assets/fonts/me_quran.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
